server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
